server:
  http_listen_port: 9080
  grpc_listen_port: 9095

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 102400
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  # EtherTrack Backend Logs
  - job_name: ethertrack-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: ethertrack-backend
          app: ethertrack
          component: backend
          environment: production
          __path__: /var/log/ethertrack-backend/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            requestId: requestId
            userId: userId
            method: method
            path: path
            statusCode: statusCode
            durationMs: durationMs
            ip: ip
            userAgent: userAgent
      - labels:
          level:
          service:
          requestId:
          userId:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

  # EtherTrack Frontend Logs (if available)
  - job_name: ethertrack-frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: ethertrack-frontend
          app: ethertrack
          component: frontend
          environment: production
          __path__: /var/log/ethertrack-frontend/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # Kubernetes Pod Logs
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - ethertrack
            - ethertrack-staging
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_component]
        target_label: component
      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version
      - source_labels: [__meta_kubernetes_pod_label_color]
        target_label: color
      - action: keep
        regex: ethertrack.*
        source_labels: [__meta_kubernetes_pod_label_app]
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            requestId: requestId
            userId: userId
      - labels:
          level:
          service:
          app:
          component:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # Nginx Access Logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          app: ethertrack
          component: nginx
          environment: production
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          status:
          remote_addr:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"

  # Nginx Error Logs
  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          app: ethertrack
          component: nginx
          environment: production
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?P<message>.*)'
      - labels:
          level:
          pid:
      - timestamp:
          source: timestamp
          format: "2006/01/02 15:04:05"

  # Systemd Journal (for systemd services)
  - job_name: journal
    journal:
      json: false
      max_age: 12h
      labels:
        job: systemd-journal
      path: /var/log/journal
    relabel_configs:
      - source_labels: [__journal__systemd_unit]
        target_label: unit
      - source_labels: [__journal__priority]
        target_label: priority
      - action: keep
        regex: (ethertrack|nginx|postgres|redis|docker)
        source_labels: [__journal__systemd_unit]