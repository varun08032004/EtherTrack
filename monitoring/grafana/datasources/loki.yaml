apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: traceId
          matcherRegex: "trace[=: ]*([a-f0-9]{32})"
          url: "http://jaeger:16686/trace/$1"
        - name: spanId
          matcherRegex: "span[=: ]*([a-f0-9]{16})"
          url: "http://jaeger:16686/trace/$1"