global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@ethertrack.in'
  smtp_auth_username: 'alerts@ethertrack.in'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    - match:
        team: finance
      receiver: 'finance-alerts'
      continue: true
    - match:
        team: security
      receiver: 'security-alerts'
      continue: true
    - match:
        team: blockchain
      receiver: 'blockchain-alerts'
      continue: true
    - match:
        team: platform
      receiver: 'platform-alerts'

receivers:
  - name: 'default'
    email_configs:
      - to: 'alerts@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[EtherTrack] {{ .GroupLabels.alertname }} - {{ .Status }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#alerts'
        send_resolved: true
        title: 'EtherTrack Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-alerts@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[CRITICAL] [EtherTrack] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        send_resolved: true
        title: '🚨 CRITICAL ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_CRITICAL_KEY}'
        severity: critical
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        details:
          alertname: '{{ .GroupLabels.alertname }}'
          severity: '{{ .GroupLabels.severity }}'
          team: '{{ .GroupLabels.team }}'
          summary: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
          description: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'warnings@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[WARNING] [EtherTrack] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#warnings'
        send_resolved: true
        title: '⚠️ WARNING'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: 'warning'

  - name: 'finance-alerts'
    email_configs:
      - to: 'finance-alerts@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[FINANCE] [EtherTrack] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#finance-alerts'
        send_resolved: true
        title: '💰 FINANCE ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: '#ff9900'

  - name: 'security-alerts'
    email_configs:
      - to: 'security-alerts@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[SECURITY] [EtherTrack] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#security-alerts'
        send_resolved: true
        title: '🔒 SECURITY ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: '#ff0000'

  - name: 'blockchain-alerts'
    email_configs:
      - to: 'blockchain-alerts@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[BLOCKCHAIN] [EtherTrack] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#blockchain-alerts'
        send_resolved: true
        title: '⛓️ BLOCKCHAIN ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: '#9b59b6'

  - name: 'platform-alerts'
    email_configs:
      - to: 'platform-alerts@ethertrack.in'
        send_resolved: true
        headers:
          subject: '[PLATFORM] [EtherTrack] {{ .GroupLabels.alertname }}'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#platform-alerts'
        send_resolved: true
        title: '⚙️ PLATFORM ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: '#3498db'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance', 'team']

  - source_match:
      alertname: 'BackendDown'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

  - source_match:
      alertname: 'DatabaseUnavailable'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

templates:
  - '/etc/alertmanager/template/*.tmpl'