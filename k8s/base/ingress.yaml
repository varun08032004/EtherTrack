# EtherTrack - Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ethertrack-api
  namespace: ethertrack
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
spec:
  tls:
    - hosts:
        - api.ethertrack.in
      secretName: ethertrack-api-tls
  rules:
    - host: api.ethertrack.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ethertrack-backend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ethertrack-frontend
  namespace: ethertrack
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "200"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - ethertrack.in
        - www.ethertrack.in
        - app.ethertrack.in
      secretName: ethertrack-frontend-tls
  rules:
    - host: ethertrack.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ethertrack-frontend
                port:
                  number: 80
    - host: www.ethertrack.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ethertrack-frontend
                port:
                  number: 80
    - host: app.ethertrack.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ethertrack-frontend
                port:
                  number: 80