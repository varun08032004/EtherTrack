# EtherTrack - ConfigMap for Application Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ethertrack-config
  namespace: ethertrack
  labels:
    app: ethertrack
data:
  # Feature Flags
  FEATURE_BLOCKCHAIN_ENABLED: "true"
  FEATURE_BLOCKCHAIN_MINTING: "true"
  FEATURE_BLOCKCHAIN_TRADING: "true"
  FEATURE_BLOCKCHAIN_RETIREMENT: "true"
  FEATURE_BLOCKCHAIN_CHAIN_LOGGING: "true"
  FEATURE_RAZORPAY_ENABLED: "true"
  FEATURE_INR_ONLY_MODE: "false"
  FEATURE_PAYMENTS_ENABLED: "true"
  FEATURE_TRADING_ENABLED: "true"
  FEATURE_KYC_ENABLED: "true"
  FEATURE_EMISSIONS_ENABLED: "true"
  FEATURE_ERP_ENABLED: "true"

  # Application Settings
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  REQUEST_TIMEOUT_MS: "30000"
  MAX_REQUEST_SIZE: "10mb"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "500"
  AUTH_RATE_LIMIT_MAX: "20"
  KYC_RATE_LIMIT_MAX: "20"
  EMISSION_RATE_LIMIT_MAX: "30"
  PAYMENT_RATE_LIMIT_MAX: "10"

  # Cache Settings
  CACHE_TTL_SHORT: "15"
  CACHE_TTL_MEDIUM: "60"
  CACHE_TTL_LONG: "300"
  CACHE_TTL_VERY_LONG: "3600"

  # Database
  DB_POOL_SIZE: "10"
  DB_POOL_IDLE_TIMEOUT: "30000"
  DB_POOL_CONNECTION_TIMEOUT: "5000"
  DB_READ_REPLICA_ENABLED: "false"

  # Redis
  REDIS_TTL_DEFAULT: "300"
  REDIS_MAX_MEMORY: "256mb"
  REDIS_EVICTION_POLICY: "allkeys-lru"

  # Blockchain
  BLOCKCHAIN_NETWORK: "sepolia"
  BLOCKCHAIN_CONFIRMATIONS: "2"
  BLOCKCHAIN_GAS_LIMIT_MULTIPLIER: "1.2"
  BLOCKCHAIN_MAX_GAS_PRICE_GWEI: "150"
  BLOCKCHAIN_RPC_TIMEOUT_MS: "30000"

  # IPFS / Pinata
  IPFS_GATEWAY: "https://gateway.pinata.cloud/ipfs/"
  PINATA_API_URL: "https://api.pinata.cloud"

  # Email
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@ethertrack.in"
  ADMIN_EMAIL: "admin@ethertrack.in"

  # Monitoring
  SENTRY_TRACES_SAMPLE_RATE: "0.2"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"

  # ERP
  ERP_SYNC_INTERVAL_MINUTES: "60"
  ERP_BATCH_SIZE: "100"
  ERP_TIMEOUT_MS: "30000"

  # Backup
  BACKUP_SCHEDULE: "0 21 * * *"
  BACKUP_TIMEZONE: "Asia/Kolkata"
  BACKUP_RETENTION_DAYS: "30"

  # Data Retention
  DATA_RETENTION_ANALYTICS_DAYS: "730"
  DATA_RETENTION_AUDIT_LOGS_DAYS: "2555"
  DATA_RETENTION_NOTIFICATIONS_DAYS: "365"

  # KYC
  KYC_EXPIRY_DAYS: "365"
  KYC_REVIEW_SLA_HOURS: "24"
  KYC_AUTO_APPROVE_THRESHOLD: "0.95"

  # Subscription
  SUBSCRIPTION_TRIAL_DAYS: "14"
  SUBSCRIPTION_GRACE_PERIOD_DAYS: "7"
  SUBSCRIPTION_RENEWAL_REMINDER_DAYS: "7"

  # Trading
  TRADE_SETTLEMENT_TIMEOUT_MINUTES: "30"
  TRADE_MAX_SLIPPAGE_BPS: "50"
  TRADE_MIN_AMOUNT_INR: "100"
  TRADE_MAX_AMOUNT_INR: "10000000"

  # Wallet
  WALLET_MIN_DEPOSIT_INR: "100"
  WALLET_MAX_DEPOSIT_INR: "1000000"
  WALLET_MIN_WITHDRAWAL_INR: "500"
  WALLET_WITHDRAWAL_FEE_BPS: "10"
  WALLET_DAILY_WITHDRAWAL_LIMIT_INR: "1000000"

  # Compliance
  COMPLIANCE_KYC_REQUIRED: "true"
  COMPLIANCE_AML_CHECK_ENABLED: "true"
  COMPLIANCE_SANCTIONS_SCREENING: "true"