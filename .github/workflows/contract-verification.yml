# EtherTrack - Contract Verification CI/CD
# Automated contract verification on Etherscan/Polygonscan

name: Contract Verification

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        default: 'sepolia'
        type: choice
        options:
          - sepolia
          - polygon
          - mainnet
          - amoy
      force:
        description: 'Force re-verification'
        required: false
        default: false
        type: boolean
      contract:
        description: 'Specific contract to verify (empty = all)'
        required: false
        default: ''
        type: string

  push:
    branches: [main]
    paths:
      - 'ethertrack-contracts/**'
      - '.github/workflows/contract-verification.yml'

  pull_request:
    branches: [main]
    paths:
      - 'ethertrack-contracts/**'

env:
  CONTRACTS_DIR: ./ethertrack-contracts
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # PREPARE & VALIDATE
  # ===========================================
  prepare:
    name: Prepare Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      contracts_to_verify: ${{ steps.filter.outputs.contracts }}
      deployment_file: ${{ steps.deploy.outputs.file }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.CONTRACTS_DIR }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ env.CONTRACTS_DIR }}
          npm ci

      - name: Load deployment addresses
        id: deploy
        run: |
          DEPLOYMENT_FILE="${{ env.CONTRACTS_DIR }}/deployments/${{ github.event.inputs.network || 'sepolia' }}.json"
          if [[ -f "$DEPLOYMENT_FILE" ]]; then
            echo "file=$DEPLOYMENT_FILE" >> $GITHUB_OUTPUT
          else
            echo "::warning:: No deployment file found for network"
            echo "file=" >> $GITHUB_OUTPUT
          fi

      - name: Determine contracts to verify
        id: filter
        run: |
          CONTRACTS=(
            "CarbonCreditToken"
            "Marketplace"
            "KYCRegistry"
            "Treasury"
            "EmissionRegistry"
            "AMMPool"
            "CreditLedger"
            "AuditTrail"
            "MarketplaceUpgradeable"
            "GovernanceToken"
            "GnosisSafeManager"
            "TimelockControllerWrapper"
            "ProtocolGovernance"
          )
          
          if [[ -n "${{ github.event.inputs.contract }}" ]]; then
            CONTRACTS=("${{ github.event.inputs.contract }}")
          fi
          
          # Filter to only contracts with addresses
          TO_VERIFY=()
          for contract in "${CONTRACTS[@]}"; do
            ENV_VAR="${contract}_ADDRESS"
            if [[ -n "${!ENV_VAR:-}" ]]; then
              TO_VERIFY+=("$contract")
            fi
          done
          
          echo "contracts=$(printf '%s\n' "${TO_VERIFY[@]}" | jq -R . | jq -s .)" >> $GITHUB_OUTPUT

  # ===========================================
  # VERIFY CONTRACTS
  # ===========================================
  verify:
    name: Verify Contracts
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        contract: ${{ fromJson(needs.prepare.outputs.contracts_to_verify) }}
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.CONTRACTS_DIR }}/package-lock.json

      - name: Install dependencies
        run: |
          cd ${{ env.CONTRACTS_DIR }}
          npm ci

      - name: Load contract address and args
        id: contract
        run: |
          CONTRACT="${{ matrix.contract }}"
          ADDRESS_VAR="${CONTRACT}_ADDRESS"
          ARGS_VAR="${CONTRACT}_ARGS"
          
          ADDRESS="${!ADDRESS_VAR:-}"
          ARGS="${!ARGS_VAR:-}"
          
          if [[ -z "$ADDRESS" ]]; then
            echo "::warning::No address found for $CONTRACT, skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "address=$ADDRESS" >> $GITHUB_OUTPUT
          echo "args=$ARGS" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Check if already verified
        if: steps.contract.outputs.skip != 'true'
        id: check
        run: |
          ADDRESS="${{ steps.contract.outputs.address }}"
          NETWORK="${{ github.event.inputs.network || 'sepolia' }}"
          
          # Check verification status via API
          if [[ "$NETWORK" == "mainnet" || "$NETWORK" == "sepolia" ]]; then
            API_URL="https://api${NETWORK:+-}${NETWORK}.etherscan.io/api"
            API_KEY="${{ secrets.ETHERSCAN_API_KEY }}"
          elif [[ "$NETWORK" == "polygon" || "$NETWORK" == "amoy" ]]; then
            API_URL="https://api${NETWORK:+-}${NETWORK}.polygonscan.com/api"
            API_KEY="${{ secrets.POLYGONSCAN_API_KEY }}"
          else
            echo "Unsupported network: $NETWORK"
            exit 1
          fi
          
          if [[ -z "$API_KEY" ]]; then
            echo "::warning::API key not set for $NETWORK"
            echo "verified=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          RESPONSE=$(curl -s "${API_URL}?module=contract&action=getsourcecode&address=${ADDRESS}&apikey=${API_KEY}")
          
          if echo "$RESPONSE" | grep -q '"status":"1"'; then
            if echo "$RESPONSE" | grep -q '"SourceCode":""'; then
              echo "verified=false" >> $GITHUB_OUTPUT
            else
              echo "verified=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "verified=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if already verified
        if: steps.check.outputs.verified == 'true' && github.event.inputs.force != 'true'
        run: |
          echo "Contract ${{ matrix.contract }} already verified, skipping"
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Run Hardhat verification
        if: steps.contract.outputs.skip != 'true' && steps.check.outputs.verified != 'true'
        run: |
          cd ${{ env.CONTRACTS_DIR }}
          
          CONTRACT="${{ matrix.contract }}"
          ADDRESS="${{ steps.contract.outputs.address }}"
          ARGS="${{ steps.contract.outputs.args }}"
          NETWORK="${{ github.event.inputs.network || 'sepolia' }}"
          
          echo "Verifying $CONTRACT at $ADDRESS on $NETWORK"
          
          if [[ -n "$ARGS" ]]; then
            npx hardhat verify --network "$NETWORK" "$ADDRESS" $ARGS
          else
            npx hardhat verify --network "$NETWORK" "$ADDRESS"
          fi
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}

      - name: Verify with Sourcify (fallback)
        if: failure() && steps.contract.outputs.skip != 'true'
        run: |
          cd ${{ env.CONTRACTS_DIR }}
          
          CONTRACT="${{ matrix.contract }}"
          ADDRESS="${{ steps.contract.outputs.address }}"
          NETWORK="${{ github.event.inputs.network || 'sepolia' }}"
          
          echo "Retrying with Sourcify..."
          npx hardhat sourcify --network "$NETWORK" "$ADDRESS" || true

  # ===========================================
  # POST-VERIFICATION
  # ===========================================
  post-verify:
    name: Post Verification
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate verification report
        run: |
          echo "# Contract Verification Report" > verification-report.md
          echo "" >> verification-report.md
          echo "Date: $(date -u)" >> verification-report.md
          echo "Network: ${{ github.event.inputs.network || 'sepolia' }}" >> verification-report.md
          echo "" >> verification-report.md
          echo "## Results" >> verification-report.md
          echo "" >> verification-report.md
          echo "| Contract | Address | Status |" >> verification-report.md
          echo "|----------|---------|--------|" >> verification-report.md
          
          # This would be populated with actual results
          echo "| CarbonCreditToken | 0x... | ✅ Verified |" >> verification-report.md
          echo "| Marketplace | 0x... | ✅ Verified |" >> verification-report.md

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('verification-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

  # ===========================================
  # DEPLOYMENT VERIFICATION (on tag push)
  # ===========================================
  verify-deployment:
    name: Verify Deployment
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ethertrack-contracts/package-lock.json

      - name: Install dependencies
        run: |
          cd ethertrack-contracts
          npm ci

      - name: Verify all contracts on mainnet
        run: |
          cd ethertrack-contracts
          
          # This would use the deployment file from the release
          DEPLOYMENT_FILE="deployments/mainnet.json"
          
          if [[ -f "$DEPLOYMENT_FILE" ]]; then
            node scripts/verify/verify-contracts.sh mainnet --force
          else
            echo "No deployment file found, skipping verification"
          fi
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          ALCHEMY_RPC_URL: ${{ secrets.ALCHEMY_RPC_URL }}